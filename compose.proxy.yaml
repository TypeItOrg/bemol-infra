name: bemol-proxy-staging

services:
  traefik:
    image: traefik:v3.6.25
    command: ["--configFile=/etc/traefik/traefik.yml"]
    env_file: /etc/bemol/traefik/traefik.env
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # ACME writes its state under dynamic/.secrets.
      - type: bind
        source: /etc/bemol/traefik
        target: /etc/traefik
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: bemol-proxy-staging
