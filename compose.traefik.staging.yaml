# Traefik proxy for staging.
name: bemol-traefik-staging

services:
  traefik:
    image: traefik:v3.6.25
    command: ["--configFile=/etc/traefik/traefik.yaml"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/cloudflare-dns-token
    volumes:
      # Copy the static config here.
      - type: bind
        source: ./.deploy/traefik.staging.yaml
        target: /etc/traefik/traefik.yaml
        read_only: true
        bind:
          create_host_path: false
      # Generated routing rules.
      - type: bind
        source: ./build/staging/traefik/dynamic
        target: /etc/traefik/dynamic
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/bemol/secrets/cloudflare-dns-token
        target: /run/secrets/cloudflare-dns-token
        read_only: true
        bind:
          create_host_path: false
      # Keep ACME data between deploys.
      - type: bind
        source: /var/lib/bemol/traefik/staging
        target: /var/lib/traefik
        bind:
          create_host_path: false
    networks:
      - proxy
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

networks:
  proxy:
    external: true
    name: bemol-proxy-staging
