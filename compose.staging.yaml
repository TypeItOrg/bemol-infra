name: boero-staging

services:
  ui:
    container_name: boero-ui-staging
    environment:
      DEPLOYMENT_ENV: staging
      AUTO_LOGIN_ENABLED: ${AUTO_LOGIN_ENABLED:-false}

  api:
    container_name: boero-api-staging
    environment:
      SPRING_PROFILES_ACTIVE: staging
      AUTO_LOGIN_ENABLED: ${AUTO_LOGIN_ENABLED:-false}
      AUTO_LOGIN_USER_ID: ${AUTO_LOGIN_USER_ID:-}
      AUTO_LOGIN_INSTITUTION_ID: ${AUTO_LOGIN_INSTITUTION_ID:-}

  redis:
    container_name: boero-redis-staging

  postgres:
    container_name: boero-postgres-staging

volumes:
  ui-next-cache:
    name: boero-ui-next-cache-staging
  postgres-data:
    name: boero-api-postgres-data-staging
  redis-data:
    name: boero-api-redis-data-staging
  api-logs:
    name: boero-api-logs-staging
  api-storage:
    name: boero-api-enrollment-storage-staging

networks:
  default:
    name: boero-network-staging
