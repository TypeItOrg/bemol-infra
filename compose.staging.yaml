# Load after compose.yaml.
name: bemol-staging

services:
  ui:
    environment:
      DEPLOYMENT_ENV: staging
      AUTO_LOGIN_ENABLED: ${AUTO_LOGIN_ENABLED:-false}
    networks:
      default:
      proxy:
        aliases:
          - bemol-ui-staging
    labels:
      # Routing lives in Traefik files.
      traefik.enable: "false"

  api:
    environment:
      SPRING_PROFILES_ACTIVE: staging
      AUTO_LOGIN_ENABLED: ${AUTO_LOGIN_ENABLED:-false}
      AUTO_LOGIN_USER_ID: ${AUTO_LOGIN_USER_ID:-}
      AUTO_LOGIN_INSTITUTION_ID: ${AUTO_LOGIN_INSTITUTION_ID:-}
    depends_on:
      api-storage-init:
        condition: service_completed_successfully
    labels:
      traefik.enable: "false"

  redis:
    labels:
      traefik.enable: "false"

  postgres:
    environment:
      # Fail if the database is missing.
      DB_REQUIRE_EXISTING: "true"
    labels:
      traefik.enable: "false"

volumes:
  ui-next-cache:
    name: bemol-ui-next-cache-staging
  postgres-data:
    name: bemol-api-postgres-data-staging
  redis-data:
    name: bemol-api-redis-data-staging
  api-logs:
    name: bemol-api-logs-staging
  api-storage:
    name: bemol-api-enrollment-storage-staging

networks:
  default:
    external: true
    name: bemol-network-staging
  proxy:
    external: true
    name: bemol-proxy-staging
