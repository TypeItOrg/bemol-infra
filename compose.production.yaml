name: bemol-production

services:
  ui:
    environment:
      # =============================================================================
      # Application
      # =============================================================================
      DEPLOYMENT_ENV: production

  api:
    environment:
      # =============================================================================
      # Application
      # =============================================================================
      SPRING_PROFILES_ACTIVE: prod

volumes:
  ui-next-cache:
    name: bemol-ui-next-cache-production

  postgres-data:
    name: bemol-api-postgres-data-production

  redis-data:
    name: bemol-api-redis-data-production

  api-logs:
    name: bemol-api-logs-production

networks:
  default:
    external: true
    name: bemol-network-production
