server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.bemol.com.ar;

    if ($bemol_cloudflare_peer = 0) {
        return 403;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.bemol.com.ar;
    http2 on;

    include /etc/bemol/nginx/snippets/tls.conf;
    include /etc/bemol/nginx/snippets/security.conf;

    if ($bemol_cloudflare_peer = 0) {
        return 403;
    }

    include /etc/bemol/nginx/snippets/application.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name "~(?i)^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.staging\.bemol\.com\.ar$";
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name "~(?i)^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.staging\.bemol\.com\.ar$";
    http2 on;

    include /etc/bemol/nginx/snippets/tls.conf;
    include /etc/bemol/nginx/snippets/security.conf;
    include /etc/bemol/nginx/snippets/application.conf;
}
