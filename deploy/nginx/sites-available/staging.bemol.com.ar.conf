# =============================================================================
# Logging
# =============================================================================
log_format bemol '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                 '$status $body_bytes_sent request_time=$request_time '
                 'upstream_time=$upstream_response_time '
                 'limit_req=$limit_req_status limit_conn=$limit_conn_status';

access_log /var/log/nginx/bemol.access.log bemol buffer=64k flush=1s;

# =============================================================================
# HTTP Cache
# =============================================================================

proxy_cache off;

# =============================================================================
# Cloudflare
# =============================================================================

include /etc/bemol/nginx/cloudflare.conf;

# =============================================================================
# Compression
# =============================================================================

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/manifest+json
    application/xml
    application/xml+rss
    image/svg+xml;

# =============================================================================
# Request Limits
# =============================================================================

map $binary_remote_addr $bemol_network_key {
    default $binary_remote_addr;
    "~(?s)^(?<bemol_ipv6_prefix>.{8}).{8}$" $bemol_ipv6_prefix;
}

map $host $bemol_client_limit_key {
    staging.bemol.com.ar $binary_remote_addr;
    default $bemol_network_key;
}

map "$request_method:$uri" $bemol_auth_limit_key {
    default "";
    ~^POST:/auth/login/?$ $bemol_client_limit_key;
    ~^POST:/auth/register/?$ $bemol_client_limit_key;
    ~^POST:/auth/password-recovery/?$ $bemol_client_limit_key;
    ~^POST:/auth/password-recovery/reset/?$ $bemol_client_limit_key;
    ~^POST:/admin/auth/login/?$ $bemol_client_limit_key;
}

limit_req_zone $bemol_client_limit_key zone=bemol_per_client:10m rate=20r/s;
limit_req_zone $bemol_auth_limit_key zone=bemol_auth_per_client:10m rate=30r/m;
limit_conn_zone $bemol_client_limit_key zone=bemol_connections_per_client:10m;
limit_conn_zone $host zone=bemol_connections_per_host:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level notice;
limit_conn_log_level notice;

client_header_timeout 10s;
client_body_timeout 60s;
client_body_buffer_size 1m;
client_max_body_size 32m;
keepalive_timeout 30s;
send_timeout 60s;
reset_timedout_connection on;

# =============================================================================
# Application Upstream
# =============================================================================

upstream bemol_ui {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_upgrade $bemol_connection_upgrade {
    default upgrade;
    '' '';
}

# Only document navigation can receive the recovery screen.
map "$request_method:$http_rsc:$http_accept:$uri" $bemol_unavailable_uri {
    default /__bemol/unavailable;
    "~*^(GET|HEAD)::[^:]*text/html[^:]*:/maintenance\\.html$" /__bemol/maintenance;
    "~*^(GET|HEAD)::[^:]*text/html[^:]*:/(?!api(?:/|$)|_next(?:/|$))(?!.*\\.[^/]+$)" /__bemol/maintenance;
}

map $uri $bemol_unavailable_cache_control {
    default "";
    /__bemol/maintenance no-store;
    /__bemol/unavailable no-store;
}

map $uri $bemol_unavailable_retry_after {
    default "";
    /__bemol/maintenance 5;
    /__bemol/unavailable 5;
}

# =============================================================================
# Unknown Hosts: HTTP
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# =============================================================================
# Unknown Hosts: HTTPS
# =============================================================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# =============================================================================
# Platform: HTTP
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name staging.bemol.com.ar;

    if ($bemol_cloudflare_peer = 0) {
        return 403;
    }

    return 301 https://$host$request_uri;
}

# =============================================================================
# Platform: HTTPS
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.bemol.com.ar;
    http2 on;

    if ($bemol_cloudflare_peer = 0) {
        return 403;
    }

    include /etc/bemol/nginx/application.conf;
}

# =============================================================================
# Institutions: HTTP
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name "~(?i)^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.staging\.bemol\.com\.ar$";
    return 301 https://$host$request_uri;
}

# =============================================================================
# Institutions: HTTPS
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name "~(?i)^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.staging\.bemol\.com\.ar$";
    http2 on;

    include /etc/bemol/nginx/application.conf;
}
