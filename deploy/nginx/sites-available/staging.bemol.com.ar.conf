# =============================================================================
# Platform: HTTP
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name staging.bemol.com.ar;

    if ($bemol_cloudflare_peer = 0) {
        return 403;
    }

    return 301 https://$host$request_uri;
}

# =============================================================================
# Platform: HTTPS
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.bemol.com.ar;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/bemol-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bemol-staging/privkey.pem;

    if ($bemol_cloudflare_peer = 0) {
        return 403;
    }

    include /etc/nginx/snippets/bemol-application.conf;
}

# =============================================================================
# Subdomains: HTTP
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name "~(?i)^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.staging\.bemol\.com\.ar$";
    return 301 https://$host$request_uri;
}

# =============================================================================
# Subdomains: HTTPS
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name "~(?i)^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.staging\.bemol\.com\.ar$";
    http2 on;

    ssl_certificate /etc/letsencrypt/live/bemol-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bemol-staging/privkey.pem;

    include /etc/nginx/snippets/bemol-application.conf;
}
