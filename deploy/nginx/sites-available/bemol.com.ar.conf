# Production sites; requires 00-bemol-common.conf.
# Exact names win over the subdomain regex, so staging.bemol.com.ar stays in its own file.

# =============================================================================
# Platform: HTTP
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name bemol.com.ar www.bemol.com.ar;

    if ($bemol_cloudflare_peer = 0) {
        return 403;
    }

    return 301 https://bemol.com.ar$request_uri;
}

# =============================================================================
# Platform: HTTPS
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bemol.com.ar www.bemol.com.ar;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/bemol-production/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bemol-production/privkey.pem;

    if ($bemol_cloudflare_peer = 0) {
        return 403;
    }

    if ($host = www.bemol.com.ar) {
        return 301 https://bemol.com.ar$request_uri;
    }

    include /etc/bemol/nginx/application.conf;
}

# =============================================================================
# Subdomains: HTTP
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name "~(?i)^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.bemol\.com\.ar$";
    return 301 https://$host$request_uri;
}

# =============================================================================
# Subdomains: HTTPS
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name "~(?i)^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.bemol\.com\.ar$";
    http2 on;

    ssl_certificate /etc/letsencrypt/live/bemol-production/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bemol-production/privkey.pem;

    include /etc/bemol/nginx/application.conf;
}
