user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;

    log_format bemol '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent request_time=$request_time '
                     'upstream_time=$upstream_response_time '
                     'limit_req=$limit_req_status limit_conn=$limit_conn_status';
    access_log /var/log/nginx/bemol.access.log bemol buffer=64k flush=1s;

    include /etc/bemol/nginx/conf.d/*.conf;
    include /etc/bemol/nginx/sites/*.conf;
}
