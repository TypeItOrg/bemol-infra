# IPv6 addresses have 16 bytes; their first 8 bytes identify the /64 network.
map $binary_remote_addr $bemol_network_key {
    default $binary_remote_addr;
    "~(?s)^(?<bemol_ipv6_prefix>.{8}).{8}$" $bemol_ipv6_prefix;
}

map $host $bemol_client_limit_key {
    staging.bemol.com.ar $binary_remote_addr;
    default $bemol_network_key;
}

map "$request_method:$uri" $bemol_auth_limit_key {
    default "";
    ~^POST:/auth/login/?$ $bemol_client_limit_key;
    ~^POST:/auth/register/?$ $bemol_client_limit_key;
    ~^POST:/auth/password-recovery/?$ $bemol_client_limit_key;
    ~^POST:/auth/password-recovery/reset/?$ $bemol_client_limit_key;
    ~^POST:/admin/auth/login/?$ $bemol_client_limit_key;
}

limit_req_zone $bemol_client_limit_key zone=bemol_per_client:10m rate=20r/s;
limit_req_zone $bemol_auth_limit_key zone=bemol_auth_per_client:10m rate=30r/m;
limit_conn_zone $bemol_client_limit_key zone=bemol_connections_per_client:10m;
limit_conn_zone $host zone=bemol_connections_per_host:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level notice;
limit_conn_log_level notice;

client_header_timeout 10s;
client_body_timeout 60s;
client_body_buffer_size 1m;
client_max_body_size 32m;
keepalive_timeout 30s;
send_timeout 60s;
reset_timedout_connection on;
