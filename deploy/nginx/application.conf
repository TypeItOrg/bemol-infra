# =============================================================================
# TLS
# =============================================================================

ssl_certificate /etc/letsencrypt/live/bemol-staging/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/bemol-staging/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:BEMOL_TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# =============================================================================
# Security Headers
# =============================================================================

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
add_header Cache-Control $bemol_unavailable_cache_control always;
add_header Retry-After $bemol_unavailable_retry_after always;

# =============================================================================
# Request Limits
# =============================================================================

limit_req zone=bemol_per_client burst=100 nodelay;
limit_req zone=bemol_auth_per_client burst=20 nodelay;
limit_conn bemol_connections_per_client 50;
limit_conn bemol_connections_per_host 200;

# =============================================================================
# Private Routes
# =============================================================================

location ^~ /actuator {
    return 403;
}

location = /api/v1 {
    return 403;
}

location ^~ /api/v1/ {
    return 403;
}

# =============================================================================
# Application Proxy
# =============================================================================

error_page 502 503 504 =503 $bemol_unavailable_uri;

location = /__bemol/maintenance {
    internal;
    alias /opt/bemol-infra/.deploy/maintenance/maintenance.html;
    default_type text/html;
}

location = /__bemol/unavailable {
    internal;
    default_type application/json;
    return 503 '{"status":"unavailable","message":"Bemol no está disponible temporalmente."}';
}

location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Connection $bemol_connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;

    proxy_buffering off;
    proxy_intercept_errors off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_pass http://bemol_ui;
}
