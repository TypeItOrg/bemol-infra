# FRAGMENT ONLY: merge these keys into Dokploy's EXISTING static configuration.
# Preserve providers, addresses, existing resolvers, redirections and panel config.
# Do not copy this example over traefik.yml or into the dynamic directory.
entryPoints:
  web:
    forwardedHeaders:
      insecure: false
      trustedIPs: &cloudflare-proxies
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 108.162.192.0/18
        - 131.0.72.0/22
        - 141.101.64.0/18
        - 162.158.0.0/15
        - 172.64.0.0/13
        - 173.245.48.0/20
        - 188.114.96.0/20
        - 190.93.240.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
    transport: &client-transport
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 0s
        idleTimeout: 30s
  websecure:
    forwardedHeaders:
      insecure: false
      trustedIPs: *cloudflare-proxies
    transport: *client-transport

certificatesResolvers:
  cloudflare-staging:
    acme:
      email: replace-with-acme-contact@example.invalid
      storage: /etc/dokploy/traefik/dynamic/.secrets/acme-cloudflare-staging.json
      dnsChallenge:
        provider: cloudflare
        resolvers: ["1.1.1.1:53", "8.8.8.8:53"]
