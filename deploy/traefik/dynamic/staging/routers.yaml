# Generate with make render-staging-config.
http:
  routers:
    bemol-staging-institutions:
      entryPoints: [websecure]
      rule: HostRegexp(`^[a-z0-9]([a-z0-9-]*[a-z0-9])?\.${STAGING_DOMAIN_REGEX}$`)
      priority: 100
      service: bemol-staging
      middlewares: [bemol-direct, bemol-common, bemol-rate-direct, bemol-flight-direct, bemol-flight-host]
      tls: &staging-tls
        certResolver: cloudflare-staging
        domains:
          - main: ${STAGING_DOMAIN}
            sans: ["*.${STAGING_DOMAIN}"]

    bemol-staging-general:
      entryPoints: [websecure]
      rule: Host(`${STAGING_DOMAIN}`)
      priority: 100
      service: bemol-staging-general
      middlewares: [bemol-cloudflare-only, bemol-common, bemol-rate-cloudflare, bemol-flight-cloudflare, bemol-flight-host]
      tls: *staging-tls

    bemol-staging-write:
      entryPoints: [websecure]
      rule: Host(`${STAGING_DOMAIN}`) && (Method(`POST`) || Method(`PUT`) || Method(`PATCH`))
      priority: 200
      service: bemol-staging
      middlewares: [bemol-cloudflare-only, bemol-common, bemol-rate-cloudflare, bemol-flight-cloudflare, bemol-flight-host, bemol-body]
      tls: *staging-tls

    bemol-staging-institutions-write:
      entryPoints: [websecure]
      rule: HostRegexp(`^[a-z0-9]([a-z0-9-]*[a-z0-9])?\.${STAGING_DOMAIN_REGEX}$`) && (Method(`POST`) || Method(`PUT`) || Method(`PATCH`))
      priority: 200
      service: bemol-staging
      middlewares: [bemol-direct, bemol-common, bemol-rate-direct, bemol-flight-direct, bemol-flight-host, bemol-body]
      tls: *staging-tls

    bemol-staging-auth:
      entryPoints: [websecure]
      rule: Host(`${STAGING_DOMAIN}`) && Method(`POST`) && PathRegexp(`^/(auth/(login|register|password-recovery(/reset)?)|admin/auth/login)/?$`)
      priority: 300
      service: bemol-staging
      middlewares: [bemol-cloudflare-only, bemol-common, bemol-rate-cloudflare, bemol-auth-cloudflare, bemol-flight-cloudflare, bemol-flight-host, bemol-body]
      tls: *staging-tls

    bemol-staging-institutions-auth:
      entryPoints: [websecure]
      rule: HostRegexp(`^[a-z0-9]([a-z0-9-]*[a-z0-9])?\.${STAGING_DOMAIN_REGEX}$`) && Method(`POST`) && PathRegexp(`^/(auth/(login|register|password-recovery(/reset)?)|admin/auth/login)/?$`)
      priority: 300
      service: bemol-staging
      middlewares: [bemol-direct, bemol-common, bemol-rate-direct, bemol-auth-direct, bemol-flight-direct, bemol-flight-host, bemol-body]
      tls: *staging-tls

    bemol-staging-private-paths:
      entryPoints: [websecure]
      rule: (Host(`${STAGING_DOMAIN}`) || HostRegexp(`^[a-z0-9]([a-z0-9-]*[a-z0-9])?\.${STAGING_DOMAIN_REGEX}$`)) && (PathPrefix(`/actuator`) || Path(`/api/v1`) || PathPrefix(`/api/v1/`))
      priority: 400
      service: noop@internal
      middlewares: [bemol-headers, bemol-deny]
      tls: *staging-tls

    bemol-staging-www:
      entryPoints: [websecure]
      rule: Host(`www.${STAGING_DOMAIN}`)
      priority: 500
      service: noop@internal
      middlewares: [bemol-headers, bemol-canonical]
      tls: *staging-tls

    bemol-staging-http:
      entryPoints: [web]
      rule: Host(`${STAGING_DOMAIN}`) || HostRegexp(`^[a-z0-9]([a-z0-9-]*[a-z0-9])?\.${STAGING_DOMAIN_REGEX}$`)
      service: noop@internal
      middlewares: [bemol-canonical, bemol-https]
