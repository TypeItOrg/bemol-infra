# Generate with make render-staging-config.
http:
  middlewares:
    bemol-canonical:
      redirectRegex:
        regex: '^https?://www\.${STAGING_DOMAIN_REGEX}(:[0-9]+)?/(.*)'
        replacement: 'https://${STAGING_DOMAIN}/${2}'
        permanent: true

    bemol-https:
      redirectScheme:
        scheme: https
        permanent: true
