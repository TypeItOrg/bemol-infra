# General traffic keeps the default transport.
http:
  services:
    bemol-staging-general:
      loadBalancer: &ui-backend
        servers:
          - url: http://bemol-ui-staging:3000
        passHostHeader: true

    bemol-staging:
      loadBalancer:
        <<: *ui-backend
        serversTransport: bemol-staging
        responseForwarding:
          flushInterval: -1ms

  serversTransports:
    bemol-staging:
      maxIdleConnsPerHost: 32
      forwardingTimeouts:
        dialTimeout: 5s
        responseHeaderTimeout: 60s
        idleConnTimeout: 30s
