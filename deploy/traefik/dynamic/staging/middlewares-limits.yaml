http:
  middlewares:
    bemol-rate-direct:
      rateLimit: &direct-rate
        average: 20
        period: 1s
        burst: 100
        sourceCriterion:
          ipStrategy:
            depth: 0

    bemol-rate-cloudflare:
      rateLimit:
        <<: *direct-rate
        sourceCriterion: &cloudflare-source
          requestHeaderName: CF-Connecting-IP

    bemol-auth-direct:
      rateLimit: &auth-rate
        <<: *direct-rate
        average: 30
        period: 1m
        burst: 20

    bemol-auth-cloudflare:
      rateLimit:
        <<: *auth-rate
        sourceCriterion: *cloudflare-source

    # Limits apply per router and instance.
    bemol-flight-direct:
      inFlightReq:
        amount: 50
        sourceCriterion:
          ipStrategy:
            depth: 0

    bemol-flight-cloudflare:
      inFlightReq:
        amount: 50
        sourceCriterion: *cloudflare-source

    bemol-flight-host:
      inFlightReq:
        amount: 200
        sourceCriterion:
          requestHost: true

    # Buffer only writes and their responses.
    bemol-body:
      buffering:
        maxRequestBodyBytes: 33554432
        memRequestBodyBytes: 1048576
